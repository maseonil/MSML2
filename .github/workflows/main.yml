name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/gym_dataset_preprocessing.csv" 
  TARGET_VAR: "Experience_Level"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tambahkan dagshub agar script python pencarian RUN_ID bisa jalan
          pip install mlflow==2.19.0 pandas scikit-learn dagshub

      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Pastikan --experiment-name sama dengan yang dicari di step berikutnya
          mlflow run MLProject/ -e modelling.py --env-manager=local --experiment-name gym_exp_project

      - name: Get latest MLflow run_id
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Mengambil RUN_ID terbaru dari DagsHub menggunakan Python
          RUN_ID=$(python -c "import mlflow; exp = mlflow.get_experiment_by_name('gym_exp_project'); runs = mlflow.search_runs(experiment_ids=[exp.experiment_id], order_by=['attributes.start_time DESC'], max_results=1); print(runs.iloc[0]['run_id'])")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id detected from DagsHub: $RUN_ID"

      - name: Build Docker Model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Membangun image lokal dengan nama 'gym-exercise'
          mlflow models build-docker --model-uri "runs:/${{ env.RUN_ID }}/model" --name "gym-exercise"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          # Menggunakan nama secret yang Anda sebutkan di YAML terakhir
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          # Perbaikan: tag dari 'gym-exercise' (sesuai nama di build-docker) 
          # ke format 'username/repo'
          docker tag gym-exercise ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest
