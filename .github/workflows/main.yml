name: CI/CD Docker Hub Only

on:
  push:
    branches:
      - main
env:
  CSV_URL: "MLProject/gym_dataset_preprocessing.csv"
  TARGET_VAR: "Experience_Level"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
      
      - name: Check Env
        run: |
          echo $CSV_URL

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn==1.5.2

      - name: Run training
        run: |
          # Urutan: n_estimators max_depth min_samples_split criterion
          mlflow run MLProject --env-manager=local
          
      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Create Custom Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.12-slim
          WORKDIR /app
          
          # Install dependencies minimal
          RUN pip install mlflow==2.19.0 pandas scikit-learn==1.5.2
          
          # Salin artefak model yang baru saja di-generate
          COPY mlruns/0/${{ env.RUN_ID }}/artifacts/model /app/model
          
          # Port default untuk MLflow models serve
          EXPOSE 5001
          
          # Jalankan server model saat container dimulai
          ENTRYPOINT ["mlflow", "models", "serve", "-m", "/app/model", "--host", "0.0.0.0", "--port", "5001", "--no-conda"]
          EOF

      - name: Build and Tag Image
        run: |
          docker build -t gym-exercise .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag gym-exercise ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest
