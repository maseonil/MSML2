name: CI/CD Docker Hub Only

on:
  push:
    branches:
      - main
env:
  CSV_URL: "MLProject/gym_dataset_preprocessing.csv"
  TARGET_VAR: "Experience_Level"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
      
      - name: Check Env
        run: |
          echo $CSV_URL

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn==1.5.2

      - name: Run training
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: |
          # Urutan: n_estimators max_depth min_samples_split criterion
          mlflow run MLProject --env-manager=local
          
      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "gym-exercise"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag gym-exercise ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest
