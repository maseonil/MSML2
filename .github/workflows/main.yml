name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/gym_dataset_preprocessing.csv" 
  TARGET_VAR: "Experience_Level"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn dagshub

      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # 1. Logging ke DagsHub untuk keperluan data skripsi
          mlflow run MLProject/ -e modelling.py --env-manager=local --experiment-name gym_exp_project
          
          # 2. PAKSA simpan ke lokal dengan mendefinisikan backend-store-uri
          # Ini memastikan folder 'mlruns' tercipta secara fisik untuk proses build-docker
          unset MLFLOW_TRACKING_URI
          mlflow run MLProject/ -e modelling.py --env-manager=local \
            --experiment-name gym_exp_project \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns

      - name: Get latest MLflow run_id
        run: |
          # Mengambil folder ID terbaru di mlruns lokal
          # Kami menggunakan rev dan cut untuk memastikan mendapatkan UUID folder dengan benar
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | rev | cut -d'/' -f2 | rev)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest local run_id detected: $RUN_ID"

      - name: Build Docker Model
        run: |
          # Build menggunakan model yang tersimpan di mlruns lokal hasil run ke-2
          # Pastikan di modelling.py Anda menggunakan artifact_path="model"
          mlflow models build-docker --model-uri "mlruns/0/${{ env.RUN_ID }}/artifacts/model" --name "gym-exercise"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag gym-exercise ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest
