name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/gym_dataset_preprocessing.csv" 
  TARGET_VAR: "Experience_Level"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn dagshub

      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # 1. Logging ke DagsHub untuk keperluan data skripsi
          mlflow run MLProject/ -e modelling.py --env-manager=local --experiment-name gym_exp_project
          
          # 2. Hapus tracking URI agar MLflow menulis ke folder 'mlruns' lokal di GitHub
          unset MLFLOW_TRACKING_URI
          mlflow run MLProject/ -e modelling.py --env-manager=local --experiment-name gym_exp_project

      - name: Get latest MLflow run_id
        run: |
          # Mencari RUN_ID dari folder mlruns fisik yang baru dibuat
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest local run_id detected: $RUN_ID"

      - name: Build Docker Model
        run: |
          # Membangun image menggunakan model yang tersimpan di GitHub (bukan download dari DagsHub)
          mlflow models build-docker --model-uri "mlruns/0/${{ env.RUN_ID }}/artifacts/model" --name "gym-exercise"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          # Menghubungkan image lokal ke akun Docker Hub Anda
          docker tag gym-exercise ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest

      - name: Push Docker Image
        run: |
          # Mengirim image final ke Docker Hub
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest
