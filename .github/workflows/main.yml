name: CI/CD Docker Hub Only

on:
  push:
    branches:
      - main
env:
  CSV_URL: "MLProject/gym_dataset_preprocessing.csv"
  TARGET_VAR: "Experience_Level"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
      
      - name: Check Env
        run: |
          echo $CSV_URL

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn==1.5.2

      - name: Run training
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: |
          # Urutan: n_estimators max_depth min_samples_split criterion
          python MLProject/modelling.py 300 10 5 entropy

      - name: Get Run ID
        run: |
          # Mengambil folder ID terbaru dari eksperimen 0
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | rev | cut -d'/' -f2 | rev)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Using Run ID: $RUN_ID"

      - name: Build Docker Image
        run: |
          # Build menggunakan model yang tersimpan fisik di runner
          mlflow models build-docker \
            --model-uri "mlruns/0/${{ env.RUN_ID }}/artifacts/model" \
            --name "gym-exercise"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag gym-exercise ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gym-exercise:latest
